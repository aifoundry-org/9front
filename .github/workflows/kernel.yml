name: Build userlands and kernels

on:
  push:
    branches: ['**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch: ['386', amd64, arm, arm64, mips, spim, power, power64, riscv64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install QEMU and enable KVM
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy --no-install-recommends qemu-system-x86 expect gh
          if [ -e /dev/kvm ]; then
            echo "KERNEL==\"kvm\", OWNER=\"$(id -u)\", MODE=\"0600\"" | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo udevadm settle
            test -r /dev/kvm && test -w /dev/kvm
          fi

      - name: Fetch amd64 bootstrap from latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern amd64.tar.gz --dir "$RUNNER_TEMP"

      - name: Build ${{ matrix.arch }} userland and kernels
        run: .github/ci/build.sh '${{ matrix.arch }}' "$RUNNER_TEMP/amd64.tar.gz"

      # tar preserves executable modes, unlike uploading loose binaries.
      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 9front-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  smoke:
    needs: build
    uses: ./.github/workflows/smoke.yml

  release:
    if: github.ref_type == 'tag'
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: 9front-*-${{ github.sha }}
          merge-multiple: true
          path: dist

      - name: Publish release ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
